name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/client/package-lock.json
            functions/package-lock.json

      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install backend dependencies
        working-directory: functions
        run: npm ci

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.30.2

      - name: Verify backend
        working-directory: functions
        run: |
          npm run lint
          npm test
          npm run verify:emulator

      - name: Install client dependencies
        working-directory: apps/client
        run: npm ci

      - name: Verify React Native client
        working-directory: apps/client
        run: |
          npm run typecheck
          npm test -- --runInBand
